name: TRAKUNA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: trakuna-android-${{ github.ref }}
  cancel-in-progress: true

# The build needs repository read access only. No deployment credentials are used.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit-Tests ausführen
        run: gradle --no-daemon testDebugUnitTest

      - name: Android-Lint ausführen
        run: gradle --no-daemon lintDebug

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK-Prüfsumme erstellen
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: APK und Prüfsumme bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TRAKUNA-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

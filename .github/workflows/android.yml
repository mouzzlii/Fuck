name: TRAKUNA Android Build

# CI validation for the isolated scanner-diagnostics feature branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/scan-diagnostics
      - fix/handoff-cache-resume
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "scripts/check-android-security-boundaries.sh"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
      - feature/scan-diagnostics
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "scripts/check-android-security-boundaries.sh"
      - ".github/workflows/android.yml"

concurrency:
  group: trakuna-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The build needs repository read access only. No deployment credentials are used.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Offline-, Manifest- und Abhängigkeitsgrenzen prüfen
        run: bash scripts/check-android-security-boundaries.sh source

      - name: Unit-Tests ausführen
        run: gradle --no-daemon testDebugUnitTest

      - name: Android-Instrumentierungstests ohne Emulator kompilieren
        run: gradle --no-daemon compileDebugAndroidTestKotlin


      - name: Android-Lint ausführen
        run: gradle --no-daemon lintDebug

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: Herkunft zusätzlicher Manifest-Berechtigungen diagnostizieren
        if: always()
        shell: bash
        run: |
          report="app/build/outputs/logs/manifest-merger-debug-report.txt"
          if [ -f "$report" ]; then
            echo "=== Herkunft der INTERNET-Berechtigung im Manifest-Merger-Bericht ==="
            grep -n -B 8 -A 8 "android.permission.INTERNET" "$report" || true
          else
            echo "Kein Manifest-Merger-Bericht gefunden."
          fi
          packaged="app/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml"
          if [ -f "$packaged" ]; then
            echo "=== Tatsächliche Berechtigungen im Paket-Manifest ==="
            grep -oE '<uses-permission[^>]+' "$packaged" || true
          fi

      - name: Tatsächliches Paketmanifest und Offline-Grenzen prüfen
        run: bash scripts/check-android-security-boundaries.sh merged

      - name: Prüfen, ob Betreiber-Release-Signierung konfiguriert ist
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Betreiber-Signierung ist konfiguriert."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Keine Betreiber-Signierung konfiguriert; Debug-Testpaket wird erstellt."
          fi

      - name: Signiertes Release bauen (nur mit Betreiber-Secrets)
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trakuna-release.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease

      - name: Release-Prüfsumme erstellen
        if: steps.signing.outputs.configured == 'true'
        run: (cd app/build/outputs/apk/release && sha256sum app-release.apk > SHA256SUMS.txt)

      - name: Signiertes Release bereitstellen
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TRAKUNA-Android-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: APK-Prüfsumme erstellen
        run: (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)

      - name: APK und Prüfsumme bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: TRAKUNA-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

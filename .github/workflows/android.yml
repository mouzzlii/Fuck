
name: TRAKUNA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: trakuna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Unit-Tests ausführen
        run: gradle testDebugUnitTest

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TRAKUNA-Android
          path: app/build/outputs/apk/debug/app-debug.apk

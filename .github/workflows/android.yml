name: TRAKUNA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android.yml"

concurrency:
  group: trakuna-android-${{ github.ref }}
  cancel-in-progress: true

# The build needs repository read access only. No deployment credentials are used.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    permissions:
      contents: read

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Sicherheitsgrenzen des Android-Manifests prüfen
        shell: bash
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          if grep -Fq 'android.permission.INTERNET' "$manifest" &&
             ! grep -Eq '<uses-permission[^>]*android:name="android.permission.INTERNET"[^>]*tools:node="remove"' "$manifest"; then
            echo "FEHLER: INTERNET darf nur als ausdrückliche Manifest-Entfernung vorkommen."
            exit 1
          fi
          grep -Eq '<uses-permission[^>]*android:name="android.permission.INTERNET"[^>]*tools:node="remove"' "$manifest" || {
            echo "FEHLER: INTERNET-Entfernung für die ML-Kit-Transport-Abhängigkeit fehlt."
            exit 1
          }
          grep -Eq 'android:allowBackup="false"' "$manifest" || {
            echo "FEHLER: Android-Backup muss bis zur geprüften Backup-Strategie deaktiviert bleiben."
            exit 1
          }
          grep -Eq 'android:usesCleartextTraffic="false"' "$manifest" || {
            echo "FEHLER: Unverschlüsselter Netzwerkverkehr muss deaktiviert bleiben."
            exit 1
          }
          echo "OK: Keine INTERNET-Berechtigung, Android-Backup deaktiviert, Klartextverkehr deaktiviert."

      - name: Unit-Tests ausführen
        run: gradle --no-daemon testDebugUnitTest

      - name: Android-Instrumentierungstests ohne Emulator kompilieren
        run: gradle --no-daemon compileDebugAndroidTestKotlin


      - name: Android-Lint ausführen
        run: gradle --no-daemon lintDebug

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: Herkunft zusätzlicher Manifest-Berechtigungen diagnostizieren
        if: always()
        shell: bash
        run: |
          report="app/build/outputs/logs/manifest-merger-debug-report.txt"
          if [ -f "$report" ]; then
            echo "=== Herkunft der INTERNET-Berechtigung im Manifest-Merger-Bericht ==="
            grep -n -B 8 -A 8 "android.permission.INTERNET" "$report" || true
          else
            echo "Kein Manifest-Merger-Bericht gefunden."
          fi
          packaged="app/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml"
          if [ -f "$packaged" ]; then
            echo "=== Tatsächliche Berechtigungen im Paket-Manifest ==="
            grep -oE '<uses-permission[^>]+' "$packaged" || true
          fi

      - name: Zusammengeführtes Android-Manifest prüfen
        shell: bash
        run: |
          mapfile -d '' manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -print0)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "FEHLER: Kein von Gradle erzeugtes Manifest für die Prüfung gefunden."
            exit 1
          fi
          for merged in "${manifests[@]}"; do
            if grep -Fq 'android.permission.INTERNET' "$merged"; then
              echo "FEHLER: Eine Abhängigkeit oder Manifest-Zusammenführung fügt INTERNET hinzu: $merged"
              exit 1
            fi
            if grep -Eq 'android:allowBackup="true"' "$merged"; then
              echo "FEHLER: Android-Backup ist im zusammengeführten Manifest aktiviert: $merged"
              exit 1
            fi
            if grep -Eq 'android:usesCleartextTraffic="true"' "$merged"; then
              echo "FEHLER: Klartextverkehr ist im zusammengeführten Manifest aktiviert: $merged"
              exit 1
            fi
          done
          echo "OK: Zusammengeführte Manifeste enthalten keine INTERNET-Berechtigung, kein aktiviertes Backup und keinen Klartextverkehr."

      - name: Signiertes Release bauen (nur mit Betreiber-Secrets)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trakuna-release.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease

      - name: Release-Prüfsumme erstellen
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Signiertes Release bereitstellen
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: TRAKUNA-Android-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: APK-Prüfsumme erstellen
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: APK und Prüfsumme bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: TRAKUNA-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

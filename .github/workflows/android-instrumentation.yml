name: TRAKUNA Android Instrumentation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/de/trakuna/app/**"
      - "app/build.gradle.kts"
      - ".github/workflows/android-instrumentation.yml"

concurrency:
  group: trakuna-instrumentation-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Instrumentierungs-Abhängigkeiten vor dem Emulator auflösen
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Auflösen der Android-Testlaufzeit-Abhängigkeiten (Versuch $attempt/3)."
            if gradle --no-daemon :app:dependencies --configuration _internal-unified-test-platform-android-device-provider-ddmlib; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Abhängigkeitsauflösung fehlgeschlagen; mögliche Maven-Central-Drosselung. Erneuter Versuch in 30 Sekunden."
              sleep 30
            fi
          done
          echo "Android-Testlaufzeit-Abhängigkeiten konnten nach drei Versuchen nicht aufgelöst werden."
          exit 1

      - name: Android-Keystore- und Speicher-Instrumentierungstests auf Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # No KVM is available on hosted Linux; allow the emulator's QEMU TCG mode.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: default
          profile: pixel_2
          arch: x86_64
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-linux-hw-accel: auto
          disable-animations: true
          script: |
            for attempt in 1 2 3; do
              gradle --no-daemon connectedDebugAndroidTest > /tmp/trakuna-instrumentation.log 2>&1
              result=$?
              cat /tmp/trakuna-instrumentation.log
              if [ "$result" -eq 0 ]; then
                exit 0
              fi
              if grep -Eq "Received status code 429|Too Many Requests" /tmp/trakuna-instrumentation.log && [ "$attempt" -lt 3 ]; then
                echo "Maven Central throttled dependency resolution (HTTP 429); retrying in 30 seconds (attempt $attempt/3)."
                sleep 30
                continue
              fi
              exit "$result"
            done
            exit 1

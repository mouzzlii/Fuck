name: TRAKUNA Android Instrumentation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/de/trakuna/app/**"
      - "app/build.gradle.kts"
      - "scripts/run-android-instrumentation.sh"
      - ".github/workflows/android-instrumentation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/de/trakuna/app/**"
      - "app/build.gradle.kts"
      - "scripts/run-android-instrumentation.sh"
      - ".github/workflows/android-instrumentation.yml"

concurrency:
  group: trakuna-instrumentation-${{ github.ref }}
  # Emulator boots and instrumentation tests can take a long time. Keep the active run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  instrumentation:
    # This GitHub-hosted VM exposes a KVM device node but the Android emulator
    # reports that hardware acceleration is unavailable. Explicitly enable QEMU TCG.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Runner-, KVM- und Speicherdiagnose vorbereiten
        shell: bash
        run: |
          mkdir -p app/build/reports/trakuna-instrumentation
          {
            echo "=== Runner ==="
            uname -a
            echo "=== User and groups ==="
            id
            groups
            echo "=== CPU virtualization flags ==="
            grep -m1 -Eo 'vmx|svm' /proc/cpuinfo || true
            echo "=== KVM device ==="
            ls -l /dev/kvm || true
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM device is readable and writable by the runner."
            else
              echo "KVM device is not available to the runner; QEMU TCG is explicitly enabled."
            fi
            echo "=== TCG override ==="
            printf 'ANDROID_I_WANT_MY_TCG=%s\n' "$ANDROID_I_WANT_MY_TCG"
            echo "=== Disk ==="
            df -h
            echo "=== Memory ==="
            free -h
          } 2>&1 | tee app/build/reports/trakuna-instrumentation/runner-preflight.txt

      - name: Instrumentierungs-Abhängigkeiten vor dem Emulator auflösen
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Auflösen der Android-Testlaufzeit-Abhängigkeiten (Versuch $attempt/3)."
            if gradle --no-daemon :app:dependencies --configuration _internal-unified-test-platform-android-device-provider-ddmlib; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Abhängigkeitsauflösung fehlgeschlagen; mögliche Maven-Central-Drosselung. Erneuter Versuch in 30 Sekunden."
              sleep 30
            fi
          done
          echo "Android-Testlaufzeit-Abhängigkeiten konnten nach drei Versuchen nicht aufgelöst werden."
          exit 1

      - name: Android-Keystore- und Speicher-Instrumentierungstests auf Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          profile: pixel_2
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -verbose
          disable-animations: true
          script: bash scripts/run-android-instrumentation.sh

      - name: Emulator- und Instrumentierungsdiagnose bei Fehler sichern
        if: failure()
        shell: bash
        run: |
          mkdir -p app/build/reports/trakuna-instrumentation
          {
            echo "=== ADB devices ==="
            adb devices -l || true
            echo "=== Emulator processes ==="
            pgrep -af 'emulator|qemu' || true
            echo "=== Emulator ports ==="
            ss -ltnp || true
            echo "=== AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | head -100 || true
            echo "=== Remaining disk and memory ==="
            df -h
            free -h
          } 2>&1 | tee app/build/reports/trakuna-instrumentation/failure-diagnostics.txt

      - name: Emulator- und Instrumentierungsdiagnose bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TRAKUNA-Instrumentation-Diagnose
          path: |
            app/build/reports/trakuna-instrumentation/
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: warn
          retention-days: 14

name: TRAKUNA Android Instrumentation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/de/trakuna/app/**"
      - "app/build.gradle.kts"
      - ".github/workflows/android-instrumentation.yml"

concurrency:
  group: trakuna-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Android-Keystore- und Speicher-Instrumentierungstests auf Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The hosted Linux runner has no KVM. Explicitly allow QEMU TCG software emulation.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: default
          profile: pixel_2
          arch: x86_64
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
